services:
  ml:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      PORT: 8001

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      - ml
    env_file:
      - ./backend/.env
    environment:
      PORT: 5000
      ML_API_URL: http://ml:8001
    ports:
      - "5000:5000"
    volumes:
      - ./storage:/app/storage
      - ./backend/uploads:/app/backend/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    env_file:
      - ./frontend/.env
    environment:
      VITE_API_URL: http://backend:5000
    ports:
      - "3000:3000"